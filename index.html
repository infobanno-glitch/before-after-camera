<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作業前後カメラ</title>
<style>
  :root { --bg:#f5f5f2; --fg:#1d1d1b; --muted:#6b6b66; --line:#d9d9d2; --accent:#1f5f4a; --card:#ffffff; --warn:#b3261e; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141513; --fg:#ecece6; --muted:#9a9a92; --line:#33342f; --accent:#6fc2a3; --card:#1d1e1b; --warn:#f2a39b; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg:#141513; --fg:#ecece6; --muted:#9a9a92; --line:#33342f; --accent:#6fc2a3; --card:#1d1e1b; --warn:#f2a39b; color-scheme: dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; font-size:15px; }
  body { max-width:640px; margin-inline:auto; padding-inline:16px; padding-block: calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px); }
  h1 { font-size:18px; margin:0 0 10px; }
  h2 { font-size:15px; margin:0 0 8px; }
  button, input { font:inherit; color:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; min-height:44px; }
  .btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn.danger { background:transparent; color:var(--warn); border:1px solid var(--line); }
  .btn.small { min-height:32px; padding:6px 10px; font-size:13px; }
  .btn:disabled { opacity:.4; }
  .btn.big { width:100%; font-size:17px; }
  input[type=text] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  input[type=range] { width:100%; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:12px; min-width:0; }
  .muted { color:var(--muted); font-size:13px; }
  .hidden { display:none !important; }
  .tabs { display:flex; gap:8px; margin-top:12px; }
  .tabs button { flex:1; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#fff; }

  .stage { position:relative; width:100%; aspect-ratio:3/4; background:#000; border-radius:10px; overflow:hidden; margin-top:12px; }
  .stage > video, .stage > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* 横向き：画面の高さに収まるように、映像の枠を横長にする */
  @media (orientation: landscape) {
    body { max-width:960px; }
    .stage { aspect-ratio:4/3; height:auto; width:min(100%, calc(72vh * 4 / 3)); margin-inline:auto; }
    .tabs, .card { margin-top:8px; }
    /* 横向き：4:3の枠の中に、シャッターを右端の縦の列に配置（重ねない） */
    .shutter-bar { top:0; bottom:0; left:auto; width:132px; flex-direction:column; justify-content:center; gap:22px; padding:16px 12px; background:linear-gradient(to left, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    .side-spacer { display:none; }
    .top-bar { left:0; right:auto; justify-content:flex-start; gap:8px; }
    .tag { top:auto; bottom:10px; left:10px; }
    #btnDetails { display:none; }
    /* 横向きのカメラ画面：画面いっぱいに表示し、ほかの要素は隠す */
    body.fs { padding:0; max-width:none; }
    body.fs > *:not(#capture) { display:none !important; }
    body.fs #capture .stage { position:fixed; inset:0; width:100%; height:100%; min-height:0; margin:0; border-radius:0; z-index:40; }
    body.fs #liveCtrl { position:fixed; left:12px; right:12px; top:52px; z-index:60; background:rgba(0,0,0,.45); padding:8px 12px; border-radius:8px; }
    body.fs #liveCtrl label { color:#fff; }
    /* シャッターを右端の縦の列に配置 */
    body.fs .shutter-bar { top:0; bottom:0; left:auto; width:132px; flex-direction:column; justify-content:center; gap:22px; padding:16px 12px; background:linear-gradient(to left, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    body.fs .side-spacer { display:none; }
    body.fs .top-bar { left:0; right:auto; justify-content:flex-start; gap:8px; }
    body.fs .tag { top:auto; bottom:10px; left:10px; }
    body.fs #camErr, body.fs #hint { position:fixed; left:12px; right:12px; top:50%; z-index:60; color:#fff; background:rgba(0,0,0,.6); padding:8px 12px; border-radius:8px; }
  }
  /* 縦向きに戻したときは、元の3:4に戻る */
  @media (orientation: portrait) {
    .stage { aspect-ratio:3/4; }
  }
  .stage .ghost { opacity: var(--ghost, .5); pointer-events:none; z-index:1; }
  .gridlines { position:absolute; inset:0; pointer-events:none; z-index:2;
    background-image: linear-gradient(to right, rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 33.333% 33.333%; }
  /* 構図が一致したとき（既定90%以上）は青色にする */
  .gridlines.aligned { background-image: linear-gradient(to right, rgba(30,144,255,.95) 2px, transparent 2px), linear-gradient(to bottom, rgba(30,144,255,.95) 2px, transparent 2px); }
  .tag { position:absolute; left:10px; top:10px; z-index:3; background:rgba(0,0,0,.6); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; }
  /* ファインダー内の操作（標準カメラのような配置） */
  .top-bar { position:absolute; top:0; left:0; right:0; z-index:4; display:flex; justify-content:flex-end; padding:10px; }
  .shutter-bar { position:absolute; left:0; right:0; bottom:0; z-index:4; display:flex; align-items:center; justify-content:center; gap:12px; padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 16px); background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .shutter { width:68px; height:68px; border-radius:50%; border:3px solid rgba(255,255,255,.75); background:rgba(255,255,255,.25); padding:0; cursor:pointer; box-shadow:none; flex:0 0 auto; }
  .shutter:disabled { opacity:.35; }
  .shutter:active { transform:scale(.94); }
  .side-btn { background:rgba(0,0,0,.45); color:#fff; border:0; border-radius:999px; padding:8px 14px; min-height:40px; font-size:13px; cursor:pointer; }
  .side-spacer { display:none; }
  .ctrl { margin-top:10px; }
  .ctrl label { display:block; color:var(--muted); font-size:13px; margin-bottom:4px; }

  /* 作業前の選択一覧（作業後の撮影時） */
  .strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-top:8px; }
  .thumb { position:relative; flex:0 0 auto; width:72px; border:2px solid transparent; border-radius:8px; padding:0; background:none; cursor:pointer; }
  .thumb img { display:block; width:72px; height:96px; object-fit:cover; border-radius:6px; }
  .thumb.sel { border-color:var(--accent); }
  .thumb .n { position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; }
  .thumb .done { position:absolute; right:4px; top:4px; background:var(--accent); color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; }

  /* 撮影済みの写真 */
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
  .pic { position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); min-width:0; }
  .pic img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; }
  .pic .cap { font-size:12px; padding:4px 6px; display:flex; justify-content:space-between; gap:4px; align-items:center; }
  .pic .del { position:absolute; right:4px; top:4px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:6px; padding:2px 7px; cursor:pointer; }
  .pair-list { display:grid; gap:8px; margin-top:8px; }
  .pair { border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--card); }
  .err { color:var(--warn); font-size:13px; }
  #fileInput { display:none; }
  /* 横向きの配置（基本の指定より後に書いて、確実に上書きする） */
  @media (orientation: landscape) {
    body { max-width:960px; }
    .stage { aspect-ratio:4/3; height:auto; width:min(100%, calc(72vh * 4 / 3)); margin-inline:auto; }
    .shutter-bar { top:0; bottom:0; left:auto; right:0; width:132px; flex-direction:column; justify-content:center; gap:22px; padding:16px 12px; background:linear-gradient(to left, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    .side-spacer { display:none; }
    .top-bar { left:0; right:auto; justify-content:flex-start; gap:8px; }
    .tag { top:auto; bottom:10px; left:10px; }
    #btnDetails { display:none; }
  }
  /* 横向き：シャッターを映像枠の右外側に出し、白く目立たない色にする */
  @media (orientation: landscape) {
    .stage { overflow:visible; }
    .shutter-bar { top:50%; bottom:auto; left:calc(100% + 18px); right:auto; width:auto; transform:translateY(-50%); flex-direction:column; justify-content:center; gap:18px; padding:0; background:none; }
    .shutter { width:64px; height:64px; background:rgba(255,255,255,.25); border:3px solid rgba(255,255,255,.75); box-shadow:none; }
    .shutter:disabled { opacity:.35; }
  }
  /* グリット線は、映像・作業前の写真より必ず前に出す */
  .stage { isolation:isolate; }
  .stage .gridlines { z-index:5; background-image: linear-gradient(to right, rgba(255,255,255,.85) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.85) 1px, transparent 1px); }
  .stage .gridlines.aligned { z-index:5; background-image: linear-gradient(to right, rgba(30,144,255,.95) 2px, transparent 2px), linear-gradient(to bottom, rgba(30,144,255,.95) 2px, transparent 2px); }
</style>
</head>
<body>
<h1>作業前後カメラ</h1>

<div class="card">
  <label class="muted" for="jobName">案件名・場所</label>
  <input type="text" id="jobName" placeholder="例：沼津市 〇〇邸 給湯器交換" style="margin-top:4px">
  <div class="row" style="margin-top:10px">
    <button class="btn" id="btnNewJob" type="button">新しい案件を開始</button>
    <select id="jobSelect" class="btn ghost small" style="min-height:36px"></select>
  </div>
  <p class="muted" id="jobInfo" style="margin:8px 0 0"></p>
</div>

<div class="tabs">
  <button class="btn ghost" id="tabBefore" type="button" aria-pressed="true">作業前を撮る</button>
  <button class="btn ghost" id="tabAfter" type="button" aria-pressed="false">作業後を撮る</button>
</div>

<!-- 作業後のとき：重ねる作業前を選ぶ -->
<div class="card hidden" id="refCard">
  <h2>重ねる作業前の写真を選ぶ</h2>
  <div class="strip" id="refStrip"></div>
  <p class="muted" id="refHint" style="margin:6px 0 0"></p>
</div>

<!-- ライブのカメラ画面 -->
<div id="capture">
  <div class="stage" id="liveStage">
    <video id="video" autoplay playsinline muted></video>
    <img id="liveGhost" class="ghost hidden" alt="">
    <div class="gridlines" id="liveGrid"></div>
    <span class="tag" id="liveTag">作業前</span>
    <div class="top-bar">
      <button class="side-btn" id="btnFlip" type="button">カメラ切替</button>
      <button class="side-btn" id="btnDetails" type="button">詳細</button>
    </div>
    <div class="shutter-bar">
      <button class="shutter" id="btnShoot" type="button" disabled aria-label="撮影"></button>
      <span class="side-spacer"></span>
    </div>
  </div>
  <div class="ctrl hidden" id="liveCtrl">
    <label for="liveOpacity">作業前の写真の透け具合</label>
    <input type="range" id="liveOpacity" min="0" max="1" step="0.05" value="0.5">
  </div>
  <p class="err hidden" id="camErr"></p>
  <p class="muted" id="hint" style="margin-top:8px"></p>
</div>

<!-- 撮影後の確認 -->
<div id="review" class="hidden">
  <div class="stage">
    <img id="reviewImg" alt="">
    <img id="reviewGhost" class="ghost hidden" alt="">
    <div class="gridlines"></div>
    <span class="tag" id="reviewTag"></span>
  </div>
  <div class="ctrl hidden" id="reviewCtrl">
    <label for="reviewOpacity">作業前の写真の透け具合</label>
    <input type="range" id="reviewOpacity" min="0" max="1" step="0.05" value="0.5">
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="btnSave" type="button">この写真で保存</button>
    <button class="btn ghost" id="btnRetake" type="button">撮り直す</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<!-- 撮影済みの写真 -->
<div class="card" id="photosCard">
  <h2>作業前の写真 <span class="muted" id="beforeCount"></span></h2>
  <div class="grid" id="beforeGrid"></div>
  <h2 style="margin-top:14px">作業後の写真 <span class="muted" id="afterCount"></span></h2>
  <div class="grid" id="afterGrid"></div>
</div>

<!-- 組ごとの報告 -->
<div class="card" id="pairsCard">
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0">報告用の組</h2>
    <button class="btn small" id="btnSaveAll" type="button">すべての組を保存</button>
  </div>
  <div class="pair-list" id="pairList"></div>
</div>

<canvas id="work" class="hidden"></canvas>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const video = $("video"), work = $("work");
  let stream = null, facing = "environment";
  let mode = "before";
  let currentJobId = null;
  let refId = null;          // 作業後で重ねる作業前の写真ID
  let pending = null;
  let usingLive = false;
  const jobsMap = new Map();

  // ---------- 保存（IndexedDB） ----------
  let db = null;
  function openDb() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open("before-after-camera", 2);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("jobs")) d.createObjectStore("jobs", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }
  function saveJob(job) {
    jobsMap.set(job.id, job);
    if (!db) return;
    try { db.transaction("jobs", "readwrite").objectStore("jobs").put(job); } catch (e) {}
  }
  function loadJobs() {
    return new Promise((resolve) => {
      if (!db) return resolve([]);
      try {
        const req = db.transaction("jobs", "readonly").objectStore("jobs").getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch (e) { resolve([]); }
    });
  }
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ---------- 案件・写真のヘルパー ----------
  // job.photos: [{id, kind:"before"|"after", data, at, pairId}]
  function job() { return jobsMap.get(currentJobId) || null; }
  function befores(j) { return j ? j.photos.filter((p) => p.kind === "before") : []; }
  function afters(j) { return j ? j.photos.filter((p) => p.kind === "after") : []; }
  function photoById(j, id) { return j ? j.photos.find((p) => p.id === id) : null; }
  function pairCount(j, beforeId) { return afters(j).filter((a) => a.pairId === beforeId).length; }
  function nextUnpairedBefore(j) {
    return befores(j).find((b) => pairCount(j, b.id) === 0) || null;
  }
  function numberOf(j, beforeId) {
    return befores(j).findIndex((b) => b.id === beforeId) + 1;
  }
  function fmt(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function uid(p) { return p + Date.now() + Math.random().toString(36).slice(2, 6); }

  // ---------- カメラ ----------
  async function startCamera() {
    const err = $("camErr");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) {
      usingLive = false;
      err.textContent = "このブラウザではカメラを表示できません。https://（GitHubのアドレス）で開き直してください。";
      err.classList.remove("hidden");
      updateShootButton();
      return;
    }
    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      usingLive = true;
      err.classList.add("hidden");
    } catch (e) {
      usingLive = false;
      err.textContent = "カメラの使用が許可されていません。ブラウザのこのサイトのカメラ設定を「許可」にして、再読み込みしてください。";
      err.classList.remove("hidden");
    }
    updateShootButton();
  }

  function grabFrame() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    work.width = w; work.height = h;
    work.getContext("2d").drawImage(video, 0, 0, w, h);
    return work.toDataURL("image/jpeg", 0.9);
  }

  function updateShootButton() {
    const j = job();
    let ok = !!j;
    if (mode === "after" && !refId) ok = false;
    if (mode === "after" && j && befores(j).length === 0) ok = false;
    $("btnShoot").disabled = !(ok && usingLive);
    if (!j) $("hint").textContent = "先に案件名を入れて「新しい案件を開始」を押してください。";
    else if (mode === "before") $("hint").textContent = "作業前の写真を、必要な枚数だけ続けて撮ってください。";
    else if (!befores(j).length) $("hint").textContent = "作業前の写真がまだありません。先に作業前を撮ってください。";
    else if (!refId) $("hint").textContent = "上で、重ねる作業前の写真を選んでください。";
    else $("hint").textContent = "半透明の作業前の写真と、グリット線の位置を合わせて撮影してください。";
  }

  // ---------- 表示の更新 ----------
  function renderRefStrip() {
    const j = job();
    const strip = $("refStrip");
    strip.innerHTML = "";
    const list = befores(j);
    if (!list.length) { $("refHint").textContent = ""; return; }
    list.forEach((b, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "thumb" + (b.id === refId ? " sel" : "");
      const img = document.createElement("img"); img.src = b.data; img.alt = "作業前 " + (i + 1);
      const n = document.createElement("span"); n.className = "n"; n.textContent = "前" + (i + 1);
      btn.append(img, n);
      const c = pairCount(j, b.id);
      if (c) {
        const d = document.createElement("span"); d.className = "done"; d.textContent = c + "枚";
        btn.append(d);
      }
      btn.addEventListener("click", () => { refId = b.id; refresh(); });
      strip.appendChild(btn);
    });
    const ref = photoById(j, refId);
    $("refHint").textContent = ref
      ? "前" + numberOf(j, ref.id) + " を重ねています。緑の数字は、このお写真に対応する作業後の枚数です。"
      : "重ねる作業前の写真をタップして選んでください。";
  }

  function refreshGhostLayers() {
    const j = job();
    const ref = mode === "after" ? photoById(j, refId) : null;
    const liveOn = !!ref;
    $("liveGhost").src = liveOn ? ref.data : "";
    prepareRef(liveOn ? ref : null);
    $("liveGhost").classList.toggle("hidden", !liveOn);
    $("liveCtrl").classList.toggle("hidden", !liveOn);
    $("liveTag").textContent = mode === "before" ? "作業前" : "作業後（前" + (liveOn ? numberOf(j, ref.id) : "") + " を重ねて表示中）";
  }

  function renderPhotos() {
    const j = job();
    const bGrid = $("beforeGrid"), aGrid = $("afterGrid");
    bGrid.innerHTML = ""; aGrid.innerHTML = "";
    $("beforeCount").textContent = j ? befores(j).length + "枚" : "";
    $("afterCount").textContent = j ? afters(j).length + "枚" : "";
    if (!j) return;
    befores(j).forEach((p, i) => bGrid.appendChild(photoCard(j, p, "前" + (i + 1))));
    afters(j).forEach((p) => {
      const label = p.pairId ? "後 → 前" + numberOf(j, p.pairId) : "後（組なし）";
      aGrid.appendChild(photoCard(j, p, label));
    });
  }

  function photoCard(j, p, label) {
    const wrap = document.createElement("div");
    wrap.className = "pic";
    const img = document.createElement("img"); img.src = p.data; img.alt = label;
    const cap = document.createElement("div"); cap.className = "cap";
    const t = document.createElement("span"); t.textContent = label + "　" + fmt(p.at);
    const del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "削除";
    del.addEventListener("click", () => {
      if (!confirm("この写真を削除しますか？")) return;
      j.photos = j.photos.filter((x) => x.id !== p.id);
      if (refId === p.id) refId = null;
      saveJob(j);
      refresh();
    });
    cap.appendChild(t);
    wrap.append(img, cap, del);
    return wrap;
  }

  function renderPairs() {
    const j = job();
    const list = $("pairList");
    list.innerHTML = "";
    if (!j) return;
    const pairs = befores(j).map((b, i) => ({ b, n: i + 1, a: afters(j).filter((x) => x.pairId === b.id) }))
      .filter((x) => x.a.length);
    if (!pairs.length) { list.innerHTML = '<p class="muted">作業後の写真を撮ると、ここに組が表示されます。</p>'; return; }
    for (const x of pairs) {
      x.a.forEach((a, k) => {
        const row = document.createElement("div");
        row.className = "pair row";
        row.style.justifyContent = "space-between";
        const label = document.createElement("span");
        label.style.fontSize = "13px";
        label.textContent = "前" + x.n + "（作業前）と 後" + (k + 1) + "（作業後）";
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "btn small"; btn.textContent = "報告用画像を保存";
        btn.addEventListener("click", () => exportPair(x.b, a, x.n, k + 1));
        row.append(label, btn);
        list.appendChild(row);
      });
    }
  }

  function refresh() {
    updateShootButton();
    refreshGhostLayers();
    $("refCard").classList.toggle("hidden", mode !== "after");
    if (mode === "after") renderRefStrip();
    renderPhotos();
    renderPairs();
    $("jobInfo").textContent = job()
      ? "作業前 " + befores(job()).length + "枚／作業後 " + afters(job()).length + "枚"
      : "";
    $("btnSaveAll").disabled = !(job() && afters(job()).some((a) => a.pairId));
  }

  function setMode(m) {
    mode = m;
    $("tabBefore").setAttribute("aria-pressed", String(m === "before"));
    $("tabAfter").setAttribute("aria-pressed", String(m === "after"));
    $("review").classList.add("hidden");
    $("capture").classList.remove("hidden");
    if (m === "after") {
      const j = job();
      if (!refId || !photoById(j, refId)) {
        const next = nextUnpairedBefore(j) || befores(j)[0] || null;
        refId = next ? next.id : null;
      }
    }
    refresh();
  }

  function showReview(dataUrl) {
    pending = dataUrl;
    const j = job();
    const ref = mode === "after" ? photoById(j, refId) : null;
    $("reviewImg").src = dataUrl;
    $("reviewGhost").src = ref ? ref.data : "";
    $("reviewGhost").classList.toggle("hidden", !ref);
    $("reviewCtrl").classList.toggle("hidden", !ref);
    $("reviewTag").textContent = mode === "before" ? "作業前" : "作業後" + (ref ? "（前" + numberOf(j, ref.id) + " を重ねて表示中）" : "");
    $("capture").classList.add("hidden");
    $("review").classList.remove("hidden");
  }

  // ---------- 撮影・保存 ----------
  $("btnShoot").addEventListener("click", () => {
    const data = grabFrame();
    if (data) showReview(data);
  });
  $("btnFlip").addEventListener("click", () => {
    facing = facing === "environment" ? "user" : "environment";
    startCamera();
  });
  $("fileInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    showReview(await fileToDataUrl(file));
  });
  $("btnRetake").addEventListener("click", () => {
    pending = null;
    $("review").classList.add("hidden");
    $("capture").classList.remove("hidden");
  });
  $("btnSave").addEventListener("click", () => {
    const j = job();
    if (!j || !pending) return;
    const photo = { id: uid("p"), kind: mode, data: pending, at: new Date().toISOString(), pairId: null };
    if (mode === "after") {
      photo.pairId = refId;
    }
    j.photos.push(photo);
    saveJob(j);
    pending = null;
    $("review").classList.add("hidden");
    $("capture").classList.remove("hidden");
    if (mode === "after") {
      // 次の作業後は、まだ組になっていない作業前を自動で選ぶ
      const next = nextUnpairedBefore(j);
      if (next) refId = next.id;
    }
    refresh();
  });

  $("liveOpacity").addEventListener("input", (e) => $("capture").querySelector(".stage").style.setProperty("--ghost", e.target.value));
  $("reviewOpacity").addEventListener("input", (e) => $("review").querySelector(".stage").style.setProperty("--ghost", e.target.value));

  // ---------- 案件 ----------
  $("tabBefore").addEventListener("click", () => setMode("before"));
  $("tabAfter").addEventListener("click", () => {
    const j = job();
    if (!j || !befores(j).length) return alert("先に作業前の写真を撮ってください");
    setMode("after");
  });

  function selectJob(id) {
    currentJobId = id;
    const j = job();
    if (j) $("jobName").value = j.name;
    refId = null;
    setMode(j && befores(j).length ? "after" : "before");
    renderJobSelect();
  }

  $("btnNewJob").addEventListener("click", () => {
    const name = $("jobName").value.trim() || "無題の案件";
    const j = { id: uid("j"), name, createdAt: new Date().toISOString(), photos: [] };
    saveJob(j);
    selectJob(j.id);
  });

  $("jobSelect").addEventListener("change", (e) => {
    if (e.target.value) selectJob(e.target.value);
  });

  function renderJobSelect() {
    const sel = $("jobSelect");
    const sorted = [...jobsMap.values()].sort((x, y) => (y.createdAt || "").localeCompare(x.createdAt || ""));
    sel.innerHTML = "";
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = sorted.length ? "過去の案件を開く" : "案件はまだありません";
    sel.appendChild(blank);
    for (const j of sorted) {
      const o = document.createElement("option");
      o.value = j.id; o.textContent = j.name;
      if (j.id === currentJobId) o.selected = true;
      sel.appendChild(o);
    }
  }

  // ---------- 報告用画像（作業前と作業後を左右に並べる） ----------
  function exportPair(b, a, nBefore, nAfter) {
    const im1 = new Image(), im2 = new Image();
    let loaded = 0;
    const done = () => {
      if (++loaded < 2) return;
      const j = job();
      const h = 800, scale = h / Math.max(im1.height, im2.height);
      const w1 = im1.width * scale, w2 = im2.width * scale;
      const pad = 24, label = 64;
      const c = document.createElement("canvas");
      c.width = Math.round(w1 + w2 + pad * 3);
      c.height = Math.round(h + label + pad * 2);
      const g = c.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im1, pad, label + pad, w1, h);
      g.drawImage(im2, pad * 2 + w1, label + pad, w2, h);
      g.fillStyle = "#1d1d1b"; g.font = "bold 26px sans-serif";
      g.fillText("作業前 " + nBefore, pad, label);
      g.fillText("作業後 " + nAfter, pad * 2 + w1, label);
      const info = (j ? j.name : "") + "  " + fmt(a.at);
      g.font = "16px sans-serif"; g.fillStyle = "#6b6b66";
      g.fillText(info, c.width - pad - g.measureText(info).width, label);
      const link = document.createElement("a");
      link.href = c.toDataURL("image/jpeg", 0.92);
      link.download = (j ? j.name : "報告") + "_前" + nBefore + "_後" + nAfter + ".jpg";
      document.body.appendChild(link); link.click(); link.remove();
    };
    im1.onload = done; im2.onload = done;
    im1.src = b.data; im2.src = a.data;
  }

  $("btnSaveAll").addEventListener("click", () => {
    const j = job();
    if (!j) return;
    let delay = 0;
    befores(j).forEach((b, i) => {
      afters(j).filter((a) => a.pairId === b.id).forEach((a, k) => {
        setTimeout(() => exportPair(b, a, i + 1, k + 1), delay);
        delay += 600;
      });
    });
  });

  // ---------- 構図の一致度（作業後のライブ表示で、作業前の写真と比べる） ----------
  const ALIGN_THRESHOLD = 0.9;   // 一致とみなす割合（現場で調整できます）
  const SIZE_W = 40, SIZE_H = 30;
  const small = document.createElement("canvas");
  small.width = SIZE_W; small.height = SIZE_H;
  const sctx = small.getContext("2d", { willReadFrequently: true });
  const refCache = { id: null, vec: null };

  // 画面に表示される範囲（object-fit: cover と同じ切り抜き）を、小さな明るさのベクトルにする
  function toVector(src, sw, sh) {
    const stage = $("liveStage");
    const targetAR = (stage.clientWidth || 4) / (stage.clientHeight || 3);
    let cw = sw, ch = sh;
    if (sw / sh > targetAR) cw = sh * targetAR; else ch = sw / targetAR;
    const cx = (sw - cw) / 2, cy = (sh - ch) / 2;
    sctx.drawImage(src, cx, cy, cw, ch, 0, 0, SIZE_W, SIZE_H);
    const d = sctx.getImageData(0, 0, SIZE_W, SIZE_H).data;
    const n = SIZE_W * SIZE_H;
    const v = new Float32Array(n);
    let sum = 0;
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const g = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
      v[i] = g; sum += g;
    }
    const mean = sum / n;
    let norm = 0;
    for (let i = 0; i < n; i++) { v[i] -= mean; norm += v[i] * v[i]; }
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < n; i++) v[i] /= norm;
    return v;
  }

  function prepareRef(ref) {
    if (!ref) { refCache.id = null; refCache.vec = null; return; }
    if (refCache.id === ref.id) return;
    refCache.id = ref.id; refCache.vec = null;
    const im = new Image();
    im.onload = () => {
      if (refCache.id === ref.id) refCache.vec = toVector(im, im.naturalWidth, im.naturalHeight);
    };
    im.src = ref.data;
  }

  function updateAlignment() {
    const grid = $("liveGrid"), tagEl = $("liveTag");
    const j = job();
    const ref = mode === "after" ? photoById(j, refId) : null;
    const hidden = $("capture").classList.contains("hidden");
    if (!ref || !refCache.vec || !usingLive || !video.videoWidth || hidden) {
      grid.classList.remove("aligned");
      return;
    }
    const cur = toVector(video, video.videoWidth, video.videoHeight);
    let dot = 0;
    for (let i = 0; i < cur.length; i++) dot += cur[i] * refCache.vec[i];
    const pct = Math.round(Math.max(0, dot) * 100);
    grid.classList.toggle("aligned", pct >= ALIGN_THRESHOLD * 100);
    tagEl.textContent = "作業後（前" + numberOf(j, ref.id) + " と一致 " + pct + "%）";
  }
  setInterval(() => { try { updateAlignment(); } catch (e) {} }, 250);

  // ---------- 横向きのフルスクリーン表示 ----------
  let detailsOpen = false;
  function syncFs() {
    const landscape = window.matchMedia("(orientation: landscape)").matches;
    const capturing = !$("capture").classList.contains("hidden");
    document.body.classList.remove("fs");   // フルスクリーンは使わず、通常の表示の中に収める
  }
  $("btnDetails").addEventListener("click", () => {
    detailsOpen = !detailsOpen;
    $("btnDetails").textContent = detailsOpen ? "カメラに戻る" : "詳細";
    syncFs();
  });

  // ---------- 起動 ----------
  (async function init() {
    db = await openDb();
    (await loadJobs()).forEach((j) => {
      if (!j.photos) {
        // 旧版（1組のみ）のデータを新しい形式に移す
        j.photos = [];
        if (j.before) j.photos.push({ id: uid("p"), kind: "before", data: j.before, at: j.beforeAt, pairId: null });
        if (j.after) j.photos.push({ id: uid("p"), kind: "after", data: j.after, at: j.afterAt, pairId: j.photos.length ? j.photos[0].id : null });
      }
      jobsMap.set(j.id, j);
    });
    const latest = [...jobsMap.values()].sort((x, y) => (y.createdAt || "").localeCompare(x.createdAt || ""))[0];
    renderJobSelect();
    if (latest) selectJob(latest.id); else setMode("before");
    new MutationObserver(syncFs).observe($("capture"), { attributes: true, attributeFilter: ["class"] });
    window.addEventListener("resize", syncFs);
    window.addEventListener("orientationchange", syncFs);
    syncFs();
    startCamera();
  })();
})();
</script>
</body>
